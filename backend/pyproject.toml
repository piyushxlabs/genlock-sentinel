[project]
name = "genlock-sentinel"
version = "0.1.0"
description = "Autonomous telemetry-driven SRE & frame-sync integrity agent for ICVFX nDisplay LED stages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.1.0",
    "google-genai>=1.0.0",
    "pydantic>=2.9,<3",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "ag-ui-protocol>=0.1.0",
    "adk-agui-middleware>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv]
# Standard uv-managed lockfile; no custom index required
